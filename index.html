<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>حكاية قبل النوم 🌙</title>
  <meta name="description" content="قصص أطفال قصيرة وهادفة قبل النوم">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, Tahoma;
      background: #0d1b2a;
      color: white;
      text-align: center;
    }
    header {
      padding: 40px 20px;
      background: linear-gradient(135deg, #1b263b, #415a77);
    }
    h1 {
      font-size: 32px;
    }
    p {
      font-size: 18px;
      line-height: 1.8;
    }
    section {
      padding: 30px 20px;
    }
    .story {
      background: #1b263b;
      margin: 15px auto;
      padding: 20px;
      max-width: 600px;
      border-radius: 10px;
    }
    footer {
      background: #000814;
      padding: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<header>
  <h1>🌙 حكاية قبل النوم</h1>
  <p>قصص أطفال قصيرة وهادفة تساعد على نوم هادئ</p>
</header>

<section>
  <h2>📖 قصة اليوم</h2>
  <div class="story">
    <h3>القمر الصغير</h3>
    <p>
      في ليلة هادئة، نظر طفل إلى القمر وسأله: لماذا تضيء دائمًا؟  
      ابتسم القمر وقال: لأحرس أحلامك الجميلة.  
      نام الطفل سعيدًا… 🌙
    </p>
  </div>
</section>

<footer>
  © 2025 حكاية قبل النوم
</footer>

</body>
</html>
